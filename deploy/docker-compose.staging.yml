services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: chorify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: chorify_projects
    volumes:
      - chorify_staging_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chorify -d chorify_projects"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ..
      target: builder
    environment:
      DATABASE_URL: postgresql://chorify:${POSTGRES_PASSWORD}@postgres:5432/chorify_projects?schema=public
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ${MINIO_DATA_DIR:-/home/donxu/webServer/data/aipmf-minio}:/data
    ports:
      - "127.0.0.1:9000:9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-aipmf-files}
    entrypoint: ["/bin/sh", "-c"]
    command: ["mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD && mc mb --ignore-existing local/$$S3_BUCKET && mc anonymous set none local/$$S3_BUCKET"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: ..
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://chorify:${POSTGRES_PASSWORD}@postgres:5432/chorify_projects?schema=public
      AUTH_SECRET: ${AUTH_SECRET}
      CRON_SECRET: ${CRON_SECRET}
      APP_URL: ${APP_URL:-https://aipms.sligenai.cn}
      ALIYUN_SMS_ACCESS_KEY_ID: ${ALIYUN_SMS_ACCESS_KEY_ID:-}
      ALIYUN_SMS_ACCESS_KEY_SECRET: ${ALIYUN_SMS_ACCESS_KEY_SECRET:-}
      ALIYUN_SMS_SIGN_NAME: ${ALIYUN_SMS_SIGN_NAME:-}
      ALIYUN_SMS_TEMPLATE_CODE: ${ALIYUN_SMS_TEMPLATE_CODE:-}
      ALIYUN_SMS_REGION_ID: ${ALIYUN_SMS_REGION_ID:-cn-hangzhou}
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: ${APP_URL:-https://aipms.sligenai.cn}
      S3_REGION: us-east-1
      S3_BUCKET: ${S3_BUCKET:-aipmf-files}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_CAPACITY_PATH: /storage-capacity
    volumes:
      - ${MINIO_DATA_DIR:-/home/donxu/webServer/data/aipmf-minio}:/storage-capacity:ro
    ports:
      - "127.0.0.1:3308:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

volumes:
  chorify_staging_pg:
